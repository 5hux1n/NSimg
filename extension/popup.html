<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSimg助手</title><link rel="stylesheet" href="popup.css"></head>
<body><main>
<header>
  <div class="brand"><img src="icons/48.png" alt=""><div><h1>NSimg助手</h1><p>更适配原生编辑器</p></div></div>
  <label class="switch" title="启用/停止"><input id="enabled" type="checkbox"><span></span></label>
</header>
<section class="settings">
  <div class="labelRow"><label for="key">API Key</label><span id="keyHint">未配置</span></div>

  </div>
  <div class="actions"><button id="refresh" class="primary">获取Api Key</button><button id="clear">清除</button></div>
  <p id="message" aria-live="polite"></p>
</section>
<footer>
  <span>支持无感粘贴 · 拖拽 · 本地上传图片</span>
  <nav>
